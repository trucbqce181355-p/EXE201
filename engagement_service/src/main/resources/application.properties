spring.application.name=engagement-service
spring.config.import=optional:file:./application-local.properties
spring.jpa.hibernate.ddl-auto=update
server.port=8083
http://localhost:8083/me/loyalty/summary
http://localhost:8083/customers/1/loyalty/summary

spring.datasource.url=jdbc:mysql://localhost:3306/engagement_db?zeroDateTimeBehavior=convertToNull
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.security.allowed-origin=http://localhost:5173
app.security.jwt.secret=cfsc_group1_auth_service_secret_key_min_32_chars_for_hs256_2026_change_in_production
logging.level.org.springframework.security=DEBUG
logging.level.com.group1.engagement_service.security=DEBUG
# External services
services.customer-service.url=http://localhost:8082

# Loyalty point value default
app.loyalty.point_value=100
app.loyalty.currency=VND

app.promotion.allow-multiple-coupons=true