spring.application.name=customer-service
spring.config.import=optional:file:./application-local.properties
spring.jpa.hibernate.ddl-auto=update
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/customer_db?zeroDateTimeBehavior=convertToNull
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.security.allowed-origin=http://localhost:5173
app.security.jwt.secret=cfsc_group1_auth_service_secret_key_min_32_chars_for_hs256_2026_change_in_production